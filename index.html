<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Semanal</title>
<meta name="description" content="Planifica tu semana en un lienzo: tareas por días, prioridades y tu Google Calendar en una sola vista.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0D10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="config.js"></script>
<style>
:root{
  --bg-app:#0B0D10;--bg-panel:#0E1116;--bg-field:#12161C;--bg-raise:#151A21;--hover-raise:#1A2029;
  --chip:#161B22;--chip-hover:#1C232C;--item-hover:#171D25;--line:#1C2128;--line-strong:#242B34;
  --card-border:#1B212A;--field-border:#1F252E;--hover-border:#2E3742;--check-border:#3A434F;--track:#262D37;
  --text:#E6E9EE;--text-soft:#AEB6C2;--label:#8B95A3;--muted:#6B7684;--ph:#5A6472;
  --accent:#6D66F0;--accent-text:#A39CFB;--accent-hover:#8580F5;--ok:#4E9B72;--danger:#C9695E;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--disp:'Space Grotesk',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--sh-bar:0 10px 28px rgba(0,0,0,0.5);--sh-card:0 18px 40px -12px rgba(0,0,0,0.75);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-app);color:var(--text);font-family:var(--sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
a{color:var(--accent-text)}a:hover{color:#C4BFFD}
button,input,textarea,select{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--ph)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fvIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.mono{font-family:var(--mono)}
.disp{font-family:var(--disp)}
/* estados hover/focus (el diseño los define por elemento) */
.h-raise:hover{background:var(--bg-raise)!important}
.h-float:hover{background:var(--hover-raise)!important}
.h-dash:hover{background:var(--bg-raise)!important;color:var(--text)!important}
.h-ev:hover{background:var(--chip-hover)!important;border-color:var(--hover-border)!important}
.trow{background:var(--bg-field)}.trow:hover{background:var(--item-hover)}.trow.b{background:var(--chip)}.trow.flash{background:rgba(109,102,240,0.16)!important}
.addbox .addcal{display:none}.addbox:focus-within .addcal{display:block}
.addbox:focus-within{border-style:solid!important;border-color:var(--accent-text)!important;background:var(--bg-field)!important}
.addin:focus{border-style:solid!important;border-color:var(--accent-text)!important;background:var(--bg-field)!important;outline:none}
.h-primary:hover{background:var(--accent-hover)!important}
.h-sec:hover{background:var(--hover-raise)!important}
.h-sec2:hover{background:var(--hover-raise)!important;border-color:var(--hover-border)!important}
.h-dangero:hover{background:#1E1514!important}
.h-tint:hover{background:rgba(109,102,240,0.08)!important}
.h-tint2:hover{background:rgba(109,102,240,0.14)!important}
.h-x:hover{background:rgba(0,0,0,0.35)!important}
.h-ctx:hover{background:var(--bg-raise)!important;color:var(--text)!important}
.h-ctxd:hover{background:rgba(201,105,94,0.12)!important}
.h-show:hover{background:rgba(109,102,240,0.12)!important;color:var(--accent-text)!important}
.h-dangert:hover{background:rgba(201,105,94,0.12)!important}
.fin:focus{border-color:var(--accent-text)!important;outline:none}
.tin:focus{background:var(--bg-field)!important}
.tin2:focus{background:var(--bg-raise)!important}
/* diálogos de eventos de Google (ficha y editor) */
.btn{height:40px;padding:0 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg-raise);color:var(--text);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:all .2s var(--ease)}
.btn:hover{background:var(--hover-raise);border-color:var(--hover-border);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--disp);font-weight:700}.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:transparent;border-color:#3A2725;color:var(--danger);font-weight:500}.btn.danger:hover{background:#1E1514}
.btn.ghost{background:transparent}
.btn.small{height:32px;padding:0 10px;font-size:12.5px}
.btn.icon{width:36px;padding:0}
.field{display:flex;flex-direction:column;gap:6px}
.input{height:40px;padding:0 10px;border:1px solid var(--field-border);border-radius:8px;background:var(--bg-field);color:var(--text);width:100%;font-size:13px;outline:none}
.input:focus{border-color:var(--accent-text)}
textarea.input{height:auto;min-height:80px;padding:10px;resize:vertical;line-height:18px}
.label{font-size:12px;line-height:16px;font-weight:600;color:var(--label)}
.meta{font-size:12px;line-height:16px;color:var(--label)}
.title{font-family:var(--disp);font-size:17px;line-height:22px;font-weight:700;letter-spacing:-.01em}
.ok{color:var(--ok);font-weight:600}.err{color:var(--danger);font-weight:600}
.dot{width:10px;height:10px;border-radius:999px;flex:none;display:inline-block}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.chk{display:flex;align-items:center;gap:8px;min-height:36px;font-size:13px}
.chk input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;width:28px;height:28px;margin:0;cursor:pointer}
.swatches span{display:block;width:28px;height:28px;border-radius:999px;box-shadow:0 0 0 2px var(--bg-panel)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--bg-panel),0 0 0 4px var(--text)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.evrow{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:19px}.evrow>svg{flex:none;margin-top:1px;color:var(--label)}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;color:var(--text-soft)}
.att{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
dialog{border:1px solid var(--line-strong);border-radius:10px;padding:0;background:var(--bg-panel);color:var(--text);box-shadow:var(--sh-card);width:min(520px,calc(100vw - 24px));animation:pop .16s ease-out}
dialog::backdrop{background:rgba(5,7,9,0.45)}
#evDlg{width:min(460px,calc(100vw - 24px))}
#evEditDlg form{padding:18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 48px);overflow:auto}
.card{background:var(--bg-field);border:1px solid var(--card-border);border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){.hide-sm{display:none!important}.wkbar{top:auto!important;bottom:16px;left:16px!important;transform:none!important}.wkmenu{top:auto!important;bottom:54px;left:0!important;margin-left:0!important}}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="evDlg" aria-labelledby="evDlgTitle"><div id="evDlgBody" style="padding:18px;display:flex;flex-direction:column;gap:14px"></div></dialog>
<dialog id="evEditDlg" aria-labelledby="evFormTitle">
  <form id="evForm" novalidate>
    <h2 class="title" id="evFormTitle" style="margin:0">Nuevo evento</h2>
    <div class="field"><label class="label" for="evCal">Calendario</label><select class="input" id="evCal"></select></div>
    <fieldset id="evScopeWrap" style="border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px"><legend class="label" style="padding:0;margin-bottom:4px">Este evento se repite. ¿Qué quieres cambiar?</legend>
      <label class="chk"><input type="radio" name="evScope" value="one" checked>Solo este</label><label class="chk"><input type="radio" name="evScope" value="series">Toda la serie</label></fieldset>
    <div class="field"><label class="label" for="evTitle">Título</label><input class="input" id="evTitle" autocomplete="off"></div>
    <label class="chk"><input type="checkbox" id="evAllDay">Todo el día</label>
    <div class="row"><div class="field" style="flex:1 1 150px"><label class="label" for="evSD">Empieza</label><input class="input" type="date" id="evSD"></div><div class="field evTime" style="flex:0 1 130px"><label class="label" for="evST">Hora</label><input class="input" type="time" id="evST"></div></div>
    <div class="row"><div class="field" style="flex:1 1 150px"><label class="label" for="evED">Termina</label><input class="input" type="date" id="evED"></div><div class="field evTime" style="flex:0 1 130px"><label class="label" for="evET">Hora</label><input class="input" type="time" id="evET"></div></div>
    <div class="field" id="evRepWrap"><label class="label" for="evRep">Repetir</label><select class="input" id="evRep"><option value="KEEP" hidden>Como ahora</option><option value="">No se repite</option><option value="DAILY">Cada día</option><option value="WEEKLY">Cada semana</option><option value="MONTHLY">Cada mes</option><option value="YEARLY">Cada año</option></select></div>
    <div class="field"><label class="label" for="evLoc">Lugar</label><input class="input" id="evLoc" autocomplete="off"></div>
    <div class="field"><label class="label" for="evDesc">Descripción</label><textarea class="input" id="evDesc" rows="4"></textarea></div>
    <fieldset style="border:0;margin:0;padding:0"><legend class="label" style="padding:0;margin-bottom:8px">Color del evento</legend><div class="swatches" id="evColors"></div></fieldset>
    <p class="meta err" id="evErr" role="alert" hidden style="margin:0"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="evCancel">Cancelar</button><button type="submit" class="btn primary" id="evSave">Guardar</button></div>
  </form>
</dialog>
<input type="file" id="fileIcs" accept=".ics,text/calendar" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>

<script src="core.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
