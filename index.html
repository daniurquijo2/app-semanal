<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Semanal</title>
<meta name="description" content="Planifica tu semana: tareas por días y tu Google Calendar en una sola vista.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
:root{
  --surface-000:#f6f7fb;--surface-100:#ffffff;--surface-200:#eef0f6;--surface-300:#e2e6f0;
  --border-100:#dfe3ec;--border-200:#bfc7d6;
  --ink-900:#14181f;--ink-600:#586274;--ink-400:#8a94a6;--ink-inverse:#ffffff;
  --accent-500:#4f46e5;--accent-600:#3f37c9;--accent-100:#e9e8fd;
  --success-500:#0f7a5f;--success-100:#e3f3ee;--danger-500:#c9302c;--danger-100:#fbeaea;
  --focus-ring:#4f46e5;--scrim:#14181fa6;
  --shadow-sm:0 1px 2px rgba(20,24,31,.06);--shadow-md:0 4px 12px rgba(20,24,31,.08);--shadow-lg:0 16px 40px rgba(20,24,31,.14);
}
@media (prefers-color-scheme: dark){
  :root{
    --surface-000:#12151b;--surface-100:#1a1e26;--surface-200:#232936;--surface-300:#2c3340;
    --border-100:#2b3240;--border-200:#3d4757;
    --ink-900:#eef1f6;--ink-600:#9ba7ba;--ink-400:#6d798d;--ink-inverse:#ffffff;
    --accent-500:#8b84f7;--accent-600:#a39cfb;--accent-100:#262a45;
    --success-500:#3fd1a8;--success-100:#173a31;--danger-500:#ff8080;--danger-100:#3a2228;
    --focus-ring:#8b84f7;--scrim:#05070aba;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow-md:0 4px 14px rgba(0,0,0,.55);--shadow-lg:0 18px 44px rgba(0,0,0,.65);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--surface-000);color:var(--ink-900);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:21px}
a{color:var(--accent-500)}a:hover{color:var(--accent-600)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.overline{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.07em;color:var(--ink-600)}
.meta{font-size:12px;line-height:16px;color:var(--ink-600)}
.label{font-size:12px;line-height:16px;font-weight:600;color:var(--ink-600)}
.title{font-size:16px;line-height:22px;font-weight:700;letter-spacing:-.01em}
h1.page{margin:0;font-size:26px;line-height:30px;font-weight:700;letter-spacing:-.015em}
.btn{height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--surface-200);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink-900);white-space:nowrap}
.btn:hover{background:var(--surface-300)}
.btn.primary{background:var(--accent-500);color:#fff}.btn.primary:hover{background:var(--accent-600)}
@media (prefers-color-scheme: dark){.btn.primary{color:#101319}}
.btn.danger{background:var(--danger-100);color:var(--danger-500)}
.btn.small{height:36px;padding:0 12px;font-size:12px}
.btn.icon{width:44px;padding:0}
.btn.ghost{background:transparent;border:1px solid var(--border-100)}
.field{display:flex;flex-direction:column;gap:4px}
.input{height:44px;padding:0 12px;border:1px solid var(--border-200);border-radius:8px;background:var(--surface-200);width:100%}
textarea.input{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.card{background:var(--surface-100);border:1px solid var(--border-100);border-radius:12px}

header.top{background:var(--surface-100);border-bottom:1px solid var(--border-100);box-shadow:var(--shadow-sm);padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-900);margin-right:8px}
.tabs{display:flex;gap:4px;flex-grow:1;flex-wrap:wrap}
.tabs a{padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink-600);font-weight:600}
.tabs a[aria-current="page"]{background:var(--accent-100);color:var(--accent-600)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .lbl{display:flex;flex-direction:column;align-items:center;min-width:180px}

.layout{display:flex;flex-wrap:wrap;gap:24px;padding:24px 20px;align-items:flex-start}
aside.side{flex:1 1 240px;max-width:300px;background:var(--surface-100);border:1px solid var(--border-100);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:20px}
@media (max-width:900px){aside.side{max-width:none;order:2}header.top{position:static}}
.side section{display:flex;flex-direction:column;gap:6px}
.wk{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;background:var(--surface-200);color:var(--ink-900);text-decoration:none;gap:8px}
.wk.cur{background:var(--accent-100);color:var(--accent-600);font-weight:600}
.wk.drop-over{outline:2px dashed var(--accent-500)}
.calrow{display:flex;align-items:center;gap:8px;min-height:32px}
.dot{width:10px;height:10px;border-radius:999px;flex:none}
main.content{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:20px}

.goal{padding:16px 20px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.goal .input{background:var(--surface-200)}
.bar{height:8px;border-radius:999px;background:var(--surface-300);overflow:hidden}
.bar>div{height:100%;background:var(--success-500);border-radius:999px;transition:width .2s}

.gridwrap{overflow-x:auto;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:12px;min-width:1100px}
.day{background:var(--surface-100);border:1px solid var(--border-100);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:420px}
.day.today{border:2px solid var(--accent-500);padding:11px}
.day.drop-over,.bucket.drop-over{background:var(--accent-100)}
.dayhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:4px}
.daynum{font-size:16px;line-height:22px;font-weight:700}
.today .daynum{background:var(--accent-500);color:#fff;border-radius:999px;min-width:30px;text-align:center}
.ev{border:0;border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:#fff;font:inherit;font-size:12px;line-height:16px;width:100%;cursor:pointer}
.ev:hover{filter:brightness(1.07)}
.ev b{overflow-wrap:anywhere}
.colorpick{width:44px;height:36px;border:1px solid var(--border-200);border-radius:8px;background:var(--surface-200);padding:2px;cursor:pointer}
.swatches.sm span,.swatches.sm input{width:36px;height:36px}
.swatches span.none{background:var(--surface-200);border:2px dashed var(--border-200)}
.evrow{display:flex;gap:12px;align-items:flex-start}.evrow>svg{flex:none;margin-top:2px;color:var(--ink-600)}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
.att{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
#evDlg{width:min(560px,calc(100vw - 32px))}
#evEditDlg form{max-height:calc(100vh - 48px);overflow:auto}
.ev b{font-weight:600}
.task{display:flex;gap:8px;align-items:flex-start;background:var(--surface-200);border-radius:8px;padding:8px;cursor:grab}
.task.dragging{opacity:.45}
.task input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--accent-500);flex:none;cursor:pointer}
.task .t{flex-grow:1;min-width:0;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.task.done .t{color:var(--ink-600);text-decoration:line-through}
.task .note{color:var(--ink-400);flex:none;margin-top:2px}
.add{margin-top:auto}
.add input{width:100%;height:40px;border:1px dashed var(--border-200);border-radius:8px;background:transparent;padding:0 10px}
.add input::placeholder{color:var(--ink-600)}
.bucket{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.bucket .tasks{display:flex;flex-wrap:wrap;gap:8px}
.bucket .task{min-width:200px;max-width:340px}

.wrap{width:100%;max-width:1120px;margin:0 auto;padding:32px 20px;display:flex;flex-direction:column;gap:24px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;width:44px;height:44px;margin:0;cursor:pointer}
.swatches span{display:block;width:44px;height:44px;border-radius:999px;border:3px solid var(--surface-100)}
.swatches input:checked+span{outline:2px solid var(--ink-900)}
.swatches input:focus-visible+span{outline:2px solid var(--focus-ring);outline-offset:2px}
.calcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.calicon{width:36px;height:36px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ok{color:var(--success-500);font-weight:600}.err{color:var(--danger-500);font-weight:600}
.weekcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.wcard{padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--ink-900);text-decoration:none}
.wcard:hover{border-color:var(--border-200)}
.wcard.cur{border:2px solid var(--accent-500);padding:15px}
.wcard.future{border-style:dashed;border-color:var(--border-200)}
.pill{font-size:12px;line-height:16px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface-200);color:var(--ink-600)}
.pill.cur{background:var(--accent-100);color:var(--accent-600)}
.pill.closed{background:var(--success-100);color:var(--success-500)}
.match{font-size:12px;line-height:16px;background:var(--surface-200);border-radius:8px;padding:4px 8px}

dialog{border:0;border-radius:16px;padding:0;background:var(--surface-100);color:var(--ink-900);box-shadow:var(--shadow-lg);width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:var(--scrim)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.chk{display:flex;align-items:center;gap:8px;min-height:44px}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent-500)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink-900);color:var(--surface-100);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow-lg);z-index:50;max-width:calc(100vw - 32px)}
.empty{color:var(--ink-400);font-size:12px;line-height:16px;padding:4px 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){.grid{grid-template-columns:1fr;min-width:0}.gridwrap{overflow:visible}.day{min-height:0}.day .add{margin-top:4px}.layout{padding:16px 12px;gap:16px}.weeknav .lbl{min-width:0;flex-grow:1}.weeknav{flex-grow:1}}
</style>
</head>
<body>
<div id="app"></div>

<dialog id="taskDlg">
  <form method="dialog" id="taskForm">
    <h2 class="title" id="taskDlgTitle" style="margin:0">Tarea</h2>
    <div class="field"><label class="label" for="tTitle">Tarea</label><input class="input" id="tTitle" required autocomplete="off"></div>
    <div class="row">
      <div class="field" style="flex:1 1 180px"><label class="label" for="tDate">Día</label><input class="input" type="date" id="tDate"></div>
      <label class="chk"><input type="checkbox" id="tNoDay">Sin día concreto</label>
    </div>
    <div class="field"><label class="label" for="tNotes">Notas</label><textarea class="input" id="tNotes" rows="3"></textarea></div>
    <fieldset style="border:0;margin:0;padding:0"><legend class="label" style="padding:0;margin-bottom:8px">Color</legend><div class="swatches sm" id="tColors" style="align-items:center"></div></fieldset>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn danger" id="tDelete">Eliminar tarea</button>
      <div class="row">
        <button type="button" class="btn ghost" id="tCancel">Cancelar</button>
        <button type="submit" class="btn primary" id="tSave">Guardar cambios</button>
      </div>
    </div>
  </form>
</dialog>
<dialog id="evDlg" aria-labelledby="evDlgTitle"><div id="evDlgBody" style="padding:24px;display:flex;flex-direction:column;gap:14px"></div></dialog>
<dialog id="evEditDlg" aria-labelledby="evFormTitle">
  <form id="evForm" novalidate>
    <h2 class="title" id="evFormTitle" style="margin:0">Nuevo evento</h2>
    <div class="field"><label class="label" for="evCal">Calendario</label><select class="input" id="evCal"></select></div>
    <fieldset id="evScopeWrap" style="border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px"><legend class="label" style="padding:0;margin-bottom:4px">Este evento se repite. ¿Qué quieres cambiar?</legend>
      <label class="chk"><input type="radio" name="evScope" value="one" checked>Solo este</label><label class="chk"><input type="radio" name="evScope" value="series">Toda la serie</label></fieldset>
    <div class="field"><label class="label" for="evTitle">Título</label><input class="input" id="evTitle" autocomplete="off"></div>
    <label class="chk"><input type="checkbox" id="evAllDay">Todo el día</label>
    <div class="row"><div class="field" style="flex:1 1 150px"><label class="label" for="evSD">Empieza</label><input class="input" type="date" id="evSD"></div><div class="field evTime" style="flex:0 1 130px"><label class="label" for="evST">Hora</label><input class="input" type="time" id="evST"></div></div>
    <div class="row"><div class="field" style="flex:1 1 150px"><label class="label" for="evED">Termina</label><input class="input" type="date" id="evED"></div><div class="field evTime" style="flex:0 1 130px"><label class="label" for="evET">Hora</label><input class="input" type="time" id="evET"></div></div>
    <div class="field" id="evRepWrap"><label class="label" for="evRep">Repetir</label><select class="input" id="evRep"><option value="KEEP" hidden>Como ahora</option><option value="">No se repite</option><option value="DAILY">Cada día</option><option value="WEEKLY">Cada semana</option><option value="MONTHLY">Cada mes</option><option value="YEARLY">Cada año</option></select></div>
    <div class="field"><label class="label" for="evLoc">Lugar</label><input class="input" id="evLoc" autocomplete="off"></div>
    <div class="field"><label class="label" for="evDesc">Descripción</label><textarea class="input" id="evDesc" rows="4"></textarea></div>
    <fieldset style="border:0;margin:0;padding:0"><legend class="label" style="padding:0;margin-bottom:8px">Color del evento</legend><div class="swatches sm" id="evColors"></div></fieldset>
    <p class="meta err" id="evErr" role="alert" hidden style="margin:0"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="evCancel">Cancelar</button><button type="submit" class="btn primary" id="evSave">Guardar</button></div>
  </form>
</dialog>
<input type="file" id="fileIcs" accept=".ics,text/calendar" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>

<script>
'use strict';
/* ---------- Estado ---------- */
const STORE='appSemanal.v1';
const COLORS=['#3b34b0','#6366f1','#0b6e79','#4f6b7f','#a3480f','#9d2a6b'];
const DIAS=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
const DIASL=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function blank(){return {v:1,tasks:[],goals:{},calendars:[]};}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&Array.isArray(s.tasks))return Object.assign(blank(),s);}catch(e){}return blank();}
let state=load();
let storageOk=true;
function saveLocal(){try{const out=Object.assign({},state,{calendars:state.calendars.map(c=>c.google?Object.assign({},c,{events:[]}):c)});localStorage.setItem(STORE,JSON.stringify(out));storageOk=true;}catch(e){if(storageOk)toast('No se ha podido guardar en este navegador');storageOk=false;}}
function save(){const before=JSON.stringify(snap);stamp();saveLocal();if(JSON.stringify(snap)!==before)schedulePush();}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- Fechas ---------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDkey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,d.getHours(),d.getMinutes(),d.getSeconds());
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7));};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day+3);const y=t.getUTCFullYear();const f=new Date(Date.UTC(y,0,4));const w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);return {year:y,week:w};}
const weekKey=d=>{const {year,week}=isoWeek(d);return year+'-W'+pad(week);};
function weekStart(key){const [y,w]=key.split('-W').map(Number);return addDays(mondayOf(new Date(y,0,4)),(w-1)*7);}
const weekNum=key=>Number(key.split('-W')[1]);
function rangeLabel(key){const a=weekStart(key),b=addDays(a,6);const sameM=a.getMonth()===b.getMonth();return (sameM?a.getDate():a.getDate()+' '+MES[a.getMonth()])+' – '+b.getDate()+' '+MES[b.getMonth()]+' '+b.getFullYear();}
const todayKey=()=>dkey(new Date());
const fmtTime=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function ago(ms){const m=Math.round((Date.now()-ms)/60000);if(m<1)return 'hace un momento';if(m<60)return 'hace '+m+' min';const h=Math.round(m/60);if(h<24)return 'hace '+h+' h';const d=new Date(ms);return 'el '+d.getDate()+' '+MES[d.getMonth()]+' a las '+fmtTime(d);}

/* ---------- Utilidades ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},3200);}
const I={
 left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
 right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
 plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
 link:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1 1"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1-1"/></svg>',
 cal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 note:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Tiene notas" role="img"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 logo:'<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="4" width="24" height="22" rx="6" fill="#4f46e5"/><rect x="7" y="11" width="4" height="10" rx="2" fill="#fff"/><rect x="12" y="11" width="4" height="10" rx="2" fill="#fff" opacity=".7"/><rect x="17" y="11" width="4" height="10" rx="2" fill="#fff" opacity=".45"/></svg>'
};

/* ---------- Lector de calendarios .ics ---------- */

  for(const s of occ){const i=OCC.length;

   if(Math.max(lt,rt)>tomb){if(lt>=rt){out[k]=L[k];ots[k]=lt;}else{out[k]=Rm[k];ots[k]=rt;}}else if(tomb)otb[k]=tomb;}

function viewWeeks(){
 const cur=weekKey(new Date());const q=searchQ.trim().toLowerCase();let weeks=knownWeeks();
 let groups=[],lastM='';
 for(const w of weeks){const ts=tasksOf(w);let matches=[];if(q){matches=ts.filter(t=>(t.title+' '+t.notes).toLowerCase().includes(q));if(!matches.length&&!(state.goals[w]||'').toLowerCase().includes(q))continue;}
  const m=weekStart(w);const fut=w>cur;const ml=MESL[m.getMonth()].toUpperCase()+' '+m.getFullYear()+(fut?' · PLANIFICADAS':'');if(ml!==lastM){groups.push({label:ml,items:[]});lastM=ml;}
  const st=weekStats(w),pct=st.total?Math.round(st.done/st.total*100):0;const pend=st.total-st.done;
  const pill=w===cur?'<span class="pill cur">En curso</span>':fut?'<span class="pill">Planificada</span>':'<span class="pill closed">Cerrada</span>';
  const sub=fut?`${st.total} tarea${st.total===1?'':'s'}`:`${st.done} de ${st.total} hechas`;
  const foot=state.goals[w]?esc(state.goals[w]):(w<cur&&pend?`${pend} sin terminar`:fut&&!st.total?'<span style="color:var(--ink-400)">Sin tareas todavía</span>':'');
  groups[groups.length-1].items.push(`<a class="card wcard ${w===cur?'cur':fut?'future':''}" href="#semana/${w}"><div style="display:flex;justify-content:space-between;align-items:center"><span class="title">Semana ${weekNum(w)}</span>${pill}</div><span class="meta">${rangeLabel(w)} · ${sub}</span>${fut?'':`<div class="bar" aria-hidden="true"><div style="width:${pct}%"></div></div>`}<span class="meta" style="color:var(--ink-600)">${foot}</span>${matches.slice(0,4).map(t=>`<span class="match">${esc(t.title)}</span>`).join('')}</a>`);}
 const body=groups.map(g=>`<section style="display:flex;flex-direction:column;gap:12px"><span class="overline">${g.label}</span><div class="weekcards">${g.items.join('')}</div></section>`).join('')||'<span class="meta">No hay semanas con ese texto.</span>';
 return `<div class="wrap"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px"><div style="display:flex;flex-direction:column;gap:4px"><h1 class="page">Todas las semanas</h1><p class="meta" style="margin:0;font-size:14px;line-height:21px">Cada semana guarda sus tareas y su objetivo. Lo pendiente puedes traerlo a la siguiente.</p></div>
 <div class="field" style="flex:0 1 300px"><label class="label" for="search">Buscar en tus semanas</label><input class="input" id="search" type="search" value="${esc(searchQ)}" placeholder="Tarea, asignatura…" autocomplete="off"></div></div><div id="weeksBody" style="display:flex;flex-direction:column;gap:24px">${body}</div></div>`;
}
function render(){

 let html=header(rt);
 if(rt.v==='semana')html+=`<div class="layout">${sidebar(rt)}${viewWeek(rt)}</div>`;
 else if(rt.v==='calendarios')html+=viewCalendars();else html+=viewWeeks();
 // conservar lo escrito en el formulario de calendarios
 const keep={};['calUrl','calName','calRefresh'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value;});

 if(typing){const el=document.getElementById(typing.id);if(el){el.value=typing.v;try{el.setSelectionRange(typing.a,typing.b);}catch(_){}}}
}

 return doc.body.textContent.replace(/\n{3,}/g,'\n\n').trim();}
function linkify(t){return esc(t).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]]/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);}
function remindersText(rm){if(!rm)return '';if(rm.useDefault)return 'Aviso predeterminado del calendario';const ov=rm.overrides||[];if(!ov.length)return 'Sin avisos';
 return ov.map(x=>{const m=+x.minutes||0;const t=m===0?'a la hora':m%10080===0?(m/10080)+' semana'+(m>10080?'s':'')+' antes':m%1440===0?(m/1440)+' día'+(m>1440?'s':'')+' antes':m%60===0?(m/60)+' hora'+(m>60?'s':'')+' antes':m+' minutos antes';return t+(x.method==='email'?' (correo)':'');}).join(' · ');}
const evRow=(icon,html)=>`<div class="evrow">${icon}<div style="min-width:0;flex-grow:1">${html}</div></div>`;
const evDlg=byId('evDlg');let evOcc=null;
function canEditCal(c){return !!(c&&c.google&&c.writable&&gStatus&&gStatus.connected&&gStatus.canWrite);}
function masterOf(o){const {ev,c}=o;return ev.rrule?ev:(ev.masterId?(c.events||[]).find(x=>x.gid===ev.masterId)||null:null);}
function openEvent(i){const o=OCC[i];if(!o)return;evOcc=o;const {ev,c}=o;const bg=evColor(o);const m=masterOf(o);
 const rows=[evRow(IC.clock,esc(whenText(o)))];
 if(m&&m.rrule)rows.push(evRow(IC.repeat,esc(describeRule(m.rrule))+(ev.masterId?' <span class="meta">(esta vez está cambiada)</span>':'')));
 if(ev.location)rows.push(evRow(IC.pin,`${linkify(ev.location)}<div><a href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(ev.location)}" target="_blank" rel="noopener noreferrer">Ver en el mapa</a></div>`));
 if(/^https:\/\//i.test(ev.meet||''))rows.push(evRow(IC.video,`<a class="btn small primary" href="${esc(ev.meet)}" target="_blank" rel="noopener noreferrer">Unirse a la videollamada</a> <span class="meta">${esc(ev.meet.replace(/^https:\/\//,''))}</span>`));
 if(ev.description)rows.push(evRow(IC.text,`<div class="desc">${linkify(descText(ev.description))}</div>`));
 if(/^https?:\/\//i.test(ev.url||''))rows.push(evRow(IC.link,`<a href="${esc(ev.url)}" target="_blank" rel="noopener noreferrer">${esc(ev.url)}</a>`));
 if(ev.attendees&&ev.attendees.length){const yes=ev.attendees.filter(a=>a.status==='accepted').length;
  rows.push(evRow(IC.people,`<div>${ev.attendees.length} invitado${ev.attendees.length>1?'s':''} · ${yes} sí</div><ul class="att">${ev.attendees.map(a=>`<li><span>${esc(a.name||a.email)}${a.self?' (tú)':''}</span>${a.organizer?' <span class="meta">· organiza</span>':''}${a.optional?' <span class="meta">· opcional</span>':''} <span class="meta">· ${RESP[a.status]||a.status}</span></li>`).join('')}</ul>`));}
 else if(ev.organizer&&!ev.organizerSelf)rows.push(evRow(IC.people,'Organiza: '+esc(ev.organizer)));
 if(ev.reminders)rows.push(evRow(IC.bell,esc(remindersText(ev.reminders))));
 const edit=canEditCal(c);const recurring=!!(ev.rrule||ev.masterId);
 const note=c.google&&!edit?(c.writable?'<p class="meta" style="margin:0">Para editar desde la app, ve a Calendarios y pulsa «Dar permiso para editar».</p>':'<p class="meta" style="margin:0">Este calendario es de solo lectura.</p>'):(!c.google?'<p class="meta" style="margin:0">Calendario por enlace: solo lectura.</p>':'');
 byId('evDlgBody').innerHTML=`<div style="display:flex;gap:12px;align-items:flex-start"><span class="dot" style="width:14px;height:14px;margin-top:8px;background:${bg}"></span><div style="flex-grow:1;min-width:0"><h2 id="evDlgTitle" style="margin:0;font-size:20px;line-height:26px;font-weight:700;overflow-wrap:anywhere">${esc(ev.title)}</h2><span class="meta">${esc(c.name)}</span></div><button class="btn icon ghost" data-ev="close" aria-label="Cerrar">✕</button></div>
 ${rows.join('')}${note}
 <div id="evDelAsk" class="card" style="padding:12px;display:none;flex-direction:column;gap:8px"><span style="font-weight:600">¿Qué quieres eliminar?</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small danger" data-ev="del-one">Solo este evento</button><button class="btn small danger" data-ev="del-series">Toda la serie</button><button class="btn small" data-ev="del-cancel">Cancelar</button></div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${ev.htmlLink?`<a class="btn ghost" href="${esc(ev.htmlLink)}" target="_blank" rel="noopener noreferrer">Abrir en Google Calendar</a>`:''}${edit?`<button class="btn danger" data-ev="${recurring?'del-ask':'del-one'}">Eliminar evento</button><button class="btn primary" data-ev="edit">Editar evento</button>`:''}</div>`;
 evDlg.showModal();}
function instanceId(ev,start){if(ev.allDay)return ev.gid+'_'+dkey(start).replace(/-/g,'');const d=new Date(start);return ev.gid+'_'+d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';}
function targetId(o,scope){const {ev,start}=o;if(ev.rrule)return scope==='series'?ev.gid:instanceId(ev,start);if(ev.masterId&&scope==='series')return ev.masterId;return ev.gid;}
async function deleteEvent(scope){const o=evOcc;if(!o)return;
 if(!(o.ev.rrule||o.ev.masterId)&&!confirm('¿Eliminar «'+o.ev.title+'» de Google Calendar?'))return;
 try{await gWrite('delete',o.c.gid,targetId(o,scope));evDlg.close();toast(scope==='series'?'Serie eliminada de Google Calendar':'Evento eliminado de Google Calendar');}catch(e){toast(e.message);}}
evDlg.addEventListener('click',e=>{if(e.target===evDlg){evDlg.close();return;}const b=e.target.closest('[data-ev]');if(!b)return;const a=b.dataset.ev;
 if(a==='close')evDlg.close();
 else if(a==='edit'){const o=evOcc;evDlg.close();openEventEdit(o);}
 else if(a==='del-ask'){byId('evDelAsk').style.display='flex';}
 else if(a==='del-cancel'){byId('evDelAsk').style.display='none';}
 else if(a==='del-one')deleteEvent('one');
 else if(a==='del-series')deleteEvent('series');});

/* ---------- Crear / editar evento de Google ---------- */
const evEdit=byId('evEditDlg');let evCtx=null;
const scopeOf=()=>(document.querySelector('input[name=evScope]:checked')||{}).value||'one';
function toggleTimeFields(){const ad=byId('evAllDay').checked;document.querySelectorAll('#evForm .evTime').forEach(x=>x.hidden=ad);}
function setTimesFields(allDay,start,end){byId('evAllDay').checked=allDay;byId('evSD').value=dkey(start);
 if(allDay){const last=addDays(end,-1);byId('evED').value=dkey(last<start?start:last);byId('evST').value='09:00';byId('evET').value='10:00';}
 else{byId('evED').value=dkey(end);byId('evST').value=fmtTime(start);byId('evET').value=fmtTime(end);}toggleTimeFields();}
function setRep(v,label){const keep=byId('evRep').querySelector('option[value=KEEP]');keep.hidden=v!=='KEEP';keep.textContent='Como ahora: '+(label||'');byId('evRep').value=v;}
function setEvColor(id,cal){byId('evColors').innerHTML=`<label title="Color del calendario"><input type="radio" name="evcol" value="" aria-label="Color del calendario"><span style="background:${hex6(cal&&cal.color)}"></span></label>`+Object.entries(GCOL).map(([k,v])=>`<label title="${v.name}"><input type="radio" name="evcol" value="${k}" aria-label="${v.name}"><span style="background:${v.hex}"></span></label>`).join('');
 const r=document.querySelector(`input[name=evcol][value="${GCOL[id]?id:''}"]`);if(r)r.checked=true;}
function formValues(){return {title:byId('evTitle').value,loc:byId('evLoc').value,desc:byId('evDesc').value,color:(document.querySelector('input[name=evcol]:checked')||{}).value||'',allDay:byId('evAllDay').checked,sd:byId('evSD').value,st:byId('evST').value,ed:byId('evED').value,et:byId('evET').value,rep:byId('evRep').value};}
function applyScope(){const o=evCtx&&evCtx.o;if(!o)return;const {ev}=o;const m=evCtx.master;
 if(scopeOf()==='series'&&m){const ms=m.allDay?parseDkey(m.start):new Date(m.start),me=m.allDay?parseDkey(m.end):new Date(m.end);setTimesFields(m.allDay,ms,me);byId('evRepWrap').hidden=false;setRep('KEEP',describeRule(m.rrule));byId('evAllDay').disabled=true;}
 else{setTimesFields(ev.allDay,o.start,o.end);const rec=!!(ev.rrule||ev.masterId);byId('evRepWrap').hidden=rec;if(!rec)setRep('');byId('evAllDay').disabled=false;}
 if(evCtx.initial){const v=formValues();['allDay','sd','st','ed','et','rep'].forEach(k=>evCtx.initial[k]=v[k]);}}
function openEventEdit(o){const ws=state.calendars.filter(c=>canEditCal(c));if(!ws.length){toast('No hay calendarios de Google en los que puedas escribir');return;}
 const sel=byId('evCal');sel.innerHTML=ws.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');evCtx={o,master:null,initial:null};
 if(!o){byId('evFormTitle').textContent='Nuevo evento';sel.disabled=false;const def=ws.find(c=>c.primary)||ws[0];sel.value=def.id;byId('evScopeWrap').hidden=true;
  const rt=route();const base=rt.w&&weekKey(new Date())!==rt.w?weekStart(rt.w):new Date();const h=Math.min(new Date().getHours()+1,22);
  const st=new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,0);setTimesFields(false,st,new Date(st.getTime()+36e5));
  ['evTitle','evLoc','evDesc'].forEach(id=>byId(id).value='');setRep('');setEvColor('',def);byId('evRepWrap').hidden=false;byId('evAllDay').disabled=false;byId('evSave').textContent='Crear evento';}
 else{const {ev,c}=o;byId('evFormTitle').textContent='Editar evento';sel.value=c.id;sel.disabled=true;const rec=!!(ev.rrule||ev.masterId);evCtx.master=masterOf(o);
  byId('evScopeWrap').hidden=!rec||!evCtx.master;document.querySelector('input[name=evScope][value=one]').checked=true;
  byId('evTitle').value=ev.title==='(Sin título)'?'':ev.title;byId('evLoc').value=ev.location||'';byId('evDesc').value=descText(ev.description||'');setEvColor(ev.colorId||'',c);applyScope();byId('evSave').textContent='Guardar cambios';}
 evCtx.initial=formValues();byId('evErr').hidden=true;evEdit.showModal();byId('evTitle').focus();}
function evErr(msg){const el=byId('evErr');el.textContent=msg;el.hidden=false;}
byId('evAllDay').addEventListener('change',toggleTimeFields);
byId('evCancel').onclick=()=>evEdit.close();
document.querySelectorAll('input[name=evScope]').forEach(r=>r.addEventListener('change',applyScope));
byId('evCal').addEventListener('change',()=>{const c=state.calendars.find(x=>x.id===byId('evCal').value);const cur=(document.querySelector('input[name=evcol]:checked')||{}).value||'';setEvColor(cur,c);});
byId('evSD').addEventListener('change',()=>{if(byId('evED').value<byId('evSD').value)byId('evED').value=byId('evSD').value;});
byId('evST').addEventListener('change',()=>{const v=formValues();if(v.sd===v.ed&&v.et<=v.st&&v.st){const [h,m]=v.st.split(':').map(Number);const d=new Date(2000,0,1,h+1,m);if(h<23)byId('evET').value=fmtTime(d);}});
byId('evForm').addEventListener('submit',async e=>{e.preventDefault();if(!evCtx)return;const v=formValues(),i0=evCtx.initial||{},isNew=!evCtx.o;
 if(!v.title.trim()){evErr('Ponle un título al evento.');return;}
 if(!v.sd||!v.ed){evErr('Indica el día de inicio y de fin.');return;}
 let start,end;
 if(v.allDay){if(v.ed<v.sd){evErr('El final no puede ser antes del inicio.');return;}start={date:v.sd};end={date:dkey(addDays(parseDkey(v.ed),1))};if(!isNew&&v.allDay!==i0.allDay){start.dateTime=null;start.timeZone=null;end.dateTime=null;end.timeZone=null;}}
 else{if(!v.st||!v.et){evErr('Indica la hora de inicio y de fin.');return;}if(v.ed+'T'+v.et<v.sd+'T'+v.st){evErr('El final no puede ser antes del inicio.');return;}
  start={dateTime:`${v.sd}T${v.st}:00`,timeZone:TZ};end={dateTime:`${v.ed}T${v.et}:00`,timeZone:TZ};if(!isNew&&v.allDay!==i0.allDay){start.date=null;end.date=null;}}
 const body={};
 if(isNew||v.title!==i0.title)body.summary=v.title.trim();
 if(isNew?v.loc:v.loc!==i0.loc)body.location=v.loc;
 if(isNew?v.desc:v.desc!==i0.desc)body.description=v.desc;
 if(isNew?v.color:v.color!==i0.color)body.colorId=v.color||null;
 if(isNew||['allDay','sd','st','ed','et'].some(k=>v[k]!==i0[k])){body.start=start;body.end=end;}
 if(v.rep!=='KEEP'&&(isNew?v.rep:v.rep!==i0.rep))body.recurrence=v.rep?['RRULE:FREQ='+v.rep]:[];
 if(!isNew&&!Object.keys(body).length){evEdit.close();return;}
 const btn=byId('evSave');btn.disabled=true;byId('evErr').hidden=true;
 try{if(isNew){const c=state.calendars.find(x=>x.id===byId('evCal').value);await gWrite('create',c.gid,null,body);toast('Evento creado en Google Calendar');}
  else{await gWrite('update',evCtx.o.c.gid,targetId(evCtx.o,scopeOf()),body);toast('Cambios guardados en Google Calendar');}
  evEdit.close();}
 catch(ex){evErr(ex.message);}finally{btn.disabled=false;}});

/* Arranque */
state.calPrefs=state.calPrefs||{};
stamp();saveLocal();
updateGStatus();render();
handleRedirect().then(()=>{updateGStatus();render();if(configured())gTick(true).then(()=>driveTick(true));});
setInterval(()=>{if(configured())gTick();},10000);
setInterval(()=>{if(configured())driveTick();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&configured()){gTick(true);driveTick(true);}});
setInterval(()=>{if(route().v==='calendarios')render();},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
